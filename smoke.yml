name: Smoke test ingestion

# Runs the short-window ingestion trial on a GitHub runner, which — unlike a
# sandboxed dev environment — has a real network route to Baseball Savant.
#
# This is the "does the data path still work" check. It pulls ~10 days with
# relaxed qualification thresholds, writes nothing to site/, and cannot
# clobber a good full-season build. Run it before every `Build real data`,
# and rerun it after every schema fix.
#
# Trigger: Actions tab -> Smoke test ingestion -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to pull
        required: false
        default: "2026"
      days:
        description: How many days back from the last completed date
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: xdawg-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record dependency versions
        # Statcast schema drift usually arrives via a pybaseball bump, so pin
        # the versions into the log next to whatever the run produces.
        run: pip freeze | grep -iE "pandas|numpy|pyarrow|pybaseball|requests" || true

      - name: Run tests
        # Cheap, and it exercises the whole scoring path offline against
        # synthetic Statcast with realistic nulls. Runs BEFORE the pull so a
        # crash costs five seconds instead of forty-five minutes.
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Run smoke test
        env:
          # Surface *every* schema-drift warning, not just the first of each
          # kind. These warnings are the whole point of the smoke run.
          PYTHONWARNINGS: always
          XDAWG_CACHE: ${{ runner.temp }}/xdawg_cache
        run: |
          set -o pipefail
          python -u -m xdawg smoke \
            --season "${{ inputs.season }}" \
            --days "${{ inputs.days }}" 2>&1 | tee smoke.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### xDAWG smoke — season ${{ inputs.season }}, ${{ inputs.days }} days"
            echo
            if grep -q "Statcast schema drift" smoke.log; then
              echo "**Schema drift detected.** Missing columns:"
              echo '```'
              grep "Statcast schema drift" smoke.log | head -5
              echo '```'
            fi
            if grep -qiE "unavailable \(" smoke.log; then
              echo "**Degraded leaderboards** (their pillar terms were dropped):"
              echo '```'
              grep -iE "unavailable \(" smoke.log | head -10
              echo '```'
            fi
            echo '<details><summary>Full log</summary>'
            echo
            echo '```'
            tail -80 smoke.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log
          path: smoke.log
          retention-days: 14
