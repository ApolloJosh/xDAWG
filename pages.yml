name: Deploy leaderboard to GitHub Pages

# Publishes the contents of site/ as the Pages root, so the leaderboard
# lives at the top level of the site URL instead of under /site/.
#
# One-time setup: repo Settings -> Pages -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, skipping runs queued behind the latest.
# Do NOT cancel in-progress runs: a half-cancelled deploy leaves the Pages
# deployment stuck "in progress" on GitHub's side, which then blocks the
# next one with a 400.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
