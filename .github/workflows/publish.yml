name: Publish to Bluesky

# Phase 2, first platform. Builds the window's cards and posts them as one
# thread: the winner as the root, runners-up chained beneath.
#
# Posting is opt-in on every run. `live` defaults to false, so a dispatch
# with the defaults is a dry run that prints exactly what would go out --
# same text, same facets, same alt, same encoded image sizes, built by the
# same code path that posts. Nothing leaves the runner until somebody
# deliberately ticks the box.
#
# Credentials are an APP PASSWORD, never the account password: Bluesky
# issues them at Settings -> App Passwords, they cannot change the account's
# email or password, and revoking one disturbs nothing else. They live in
# repository secrets and reach the process as environment variables, never
# on a command line where they would land in the process table.
#
#   BSKY_HANDLE        xdawgmlb.bsky.social
#   BSKY_APP_PASSWORD  xxxx-xxxx-xxxx-xxxx
#
# Video needs a VERIFIED ACCOUNT EMAIL. Bluesky refuses uploads otherwise,
# and the refusal arrives from getUploadLimits as canUpload:false with a
# sentence saying why -- which the publish step prints before it sends
# anything, rather than after.

on:
  workflow_dispatch:
    inputs:
      window:
        description: day | week | month
        required: false
        default: day
      key:
        description: "Window key, e.g. 2026-08-28. Blank means the latest board."
        required: false
        default: ""
      top:
        description: How many winners in the thread
        required: false
        default: "5"
      live:
        description: "POST FOR REAL. Leave unticked for a dry run."
        type: boolean
        required: false
        default: false
      allow_stale:
        description: Post even if the board is more than 2 days old
        type: boolean
        required: false
        default: false
      no_video:
        description: "Cards only — skip the clips and post stills"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Never two threads at once. A duplicate day would be two roots on the
  # timeline and no way to tell which one people replied to.
  group: xdawg-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Video is a transcode queue on somebody else's machine, and five of
    # them run one after another. 30 minutes was fine for images.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest pillow
          python -m playwright install --with-deps chromium

      - name: Test
        run: python -m pytest tests/test_bluesky.py tests/test_card.py -q

      - name: Check the credentials exist
        if: ${{ inputs.live }}
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          # Fail here, before the cards are built, rather than after.
          if [ -z "$BSKY_HANDLE" ] || [ -z "$BSKY_APP_PASSWORD" ]; then
            echo "::error::Set the BSKY_HANDLE and BSKY_APP_PASSWORD repository secrets."
            exit 1
          fi
          case "$BSKY_APP_PASSWORD" in
            *-*-*-*) : ;;
            *) echo "::error::BSKY_APP_PASSWORD is not an app password (xxxx-xxxx-xxxx-xxxx). Do not use the account password."; exit 1 ;;
          esac

      - name: Publish
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          set -o pipefail
          python -u -m xdawg publish \
            --window "${{ inputs.window }}" \
            ${{ inputs.key && format('--key {0}', inputs.key) || '' }} \
            --top "${{ inputs.top }}" \
            --handle "@xdawgmlb" \
            --out posts \
            --summary publish-summary.md \
            ${{ inputs.live == true && '--live' || '' }} \
            ${{ inputs.allow_stale == true && '--allow-stale' || '' }} \
            ${{ inputs.no_video == true && '--no-video' || '' }} \
            2>&1 | tee publish.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ inputs.live && 'Posted' || 'Dry run' }} — ${{ inputs.window }} ${{ inputs.key || '(latest)' }}"
            echo
            cat publish-summary.md 2>/dev/null || {
              echo 'No summary was produced. Last 40 lines:'
              echo '```'
              tail -40 publish.log 2>/dev/null || echo '(no log)'
              echo '```'
            }
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-${{ inputs.window }}-${{ inputs.key || 'latest' }}
          path: |
            posts/
            publish.log
            publish-summary.md
          retention-days: 14
          if-no-files-found: warn
